<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Quinto Pino</title>
    <link rel="stylesheet" href="../bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <div class="container">
      <!-- HEADER -->
      <header class="row text-center border-light align-items-center mb-5">
        <div class="col-4 col-md-5">
          <img src="img/logo_white.png" alt="" class="float-end" width="100px" />
        </div>
        <div class="col">
          <h1 class="float-start"><span class="text-success">El</span> Quinto <span class="text-success">Pino</span></h1>
        </div>
      </header>

      <!-- SECTION -->
      <section class="row justify-content-center">
        <!-- MAIN -->
        <main class="col-12 col-md-10 col-lg-6 bg-success p-4 rounded mt-5">
          <h3 class="text-center text-white mb-4">Accede al portal</h3>

          <form action="" method="post" enctype="multipart/form-data">
            <!-- Usuario -->
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="userLogin" name="userLogin" placeholder="Usuario" required />
              <label for="userLogin">Usuario</label>
            </div>

            <!-- Contraseña -->
            <div class="form-floating mb-3">
              <input type="password" class="form-control" id="pw" name="pw" placeholder="Contraseña" required />
              <label for="pw">Contraseña</label>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-light fw-bold">Enviar</button>
            </div>
          </form>
        </main>
      </section>

      <!-- FOOTER -->
      <footer class="row">
        <div class="col-12"></div>
      </footer>
    </div>

    <script src="../bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
