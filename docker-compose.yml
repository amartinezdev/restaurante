services:
  db:
    image: mariadb:10.11
    container_name: restaurante_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurante
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./bd/restaurante_08_con_datos.sql:/docker-entrypoint-initdb.d/01_restaurante.sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: restaurante_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: restaurante_web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: restaurante
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
